<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<style>

    justify-content: center;

    text-align: center;
    padding: 2rem;

    color: white;
    padding: 0.85rem 1.6rem;
    text-decoration: none;
    border-radius: 999px;
    font-weight: 600;
    box-shadow: 0 6px 18px rgba(110, 31, 86, 0.32);
    transition: background 0.2s;
  }
  a:hover { background: #6e1f56; }
